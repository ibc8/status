name: Publish status

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: status-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sanitized status
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          python3 scripts/prepare_status.py
      - name: Capture compact status image
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/capture_status.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
